name: CI

# Tests on a frozen sample of real éCO2mix data (tests/fixtures), no network needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and pipeline tests (includes dbt build + data tests on the fixture)
        run: pytest -q
